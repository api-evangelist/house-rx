aid: house-rx
name: House Rx
description: 'House Rx is a healthcare technology company that equips independent specialty
  and community clinics to run in-house, medically integrated dispensing pharmacies.
  Founded in 2021, its cloud platform — built by specialty pharmacists and physicians —
  supports the full specialty-medication workflow: prior authorization, financial counseling
  and copay assistance, fulfillment tools, scalable patient outreach and messaging,
  real-time operational analytics, and EHR integration so physicians and pharmacists
  collaborate on patient care. House Rx is SOC 2 compliant and backed by First Round,
  Bessemer Venture Partners, Khosla Ventures, Maverick Ventures, 1984 Ventures, and
  Character Ventures. House Rx does not publish a public developer API; this profile
  captures its company identity, security posture, and public web properties.'
